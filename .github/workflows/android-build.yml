name: Build Android App

on:
  push:
    branches: [ "android-browser" ]
  pull_request:
    branches: [ "android-browser" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android_browser/gradlew
      continue-on-error: true 
      # Note: We haven't generated gradlew yet as we don't have Android Studio. 
      # We will use a docker container or setup gradle manually in the next step if needed, 
      # but standard actions usually handle this. 
      # Actually, since we created the project manually, we are missing the gradle wrapper files.
      # We should use a setup-gradle action or similar.

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.0'

    - name: Build with Gradle
      run: |
        cd android_browser
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: android_browser/app/build/outputs/apk/debug/app-debug.apk
