name: Build Android App

on:
  push:
    branches: [ "android-browser" ]
  pull_request:
    branches: [ "android-browser" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x android_browser/gradlew
      continue-on-error: true 

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.0'

    - name: Build with Gradle
      run: |
        cd android_browser
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android_browser/app/build/outputs/apk/debug/app-debug.apk
